name: Refresh publications

# Pulls the latest Changing Shapes episodes + their cover images from the
# Substack feed once a day and commits the refreshed snapshot. The commit to
# src/data/publications.json triggers a Vercel redeploy automatically.
#
# Requires nothing beyond the default GITHUB_TOKEN (contents: write below).
# You can also run it by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    # 06:17 UTC daily — odd minute to avoid GitHub's on-the-hour congestion.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch publications
        run: npm run fetch:publications

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- src/data/publications.json; then
            echo "No changes to publications.json — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          git commit -m "chore: refresh publications snapshot"
          git push
