<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unapp">
  <defs>
    <linearGradient id="unappBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC042"/>
      <stop offset="55%" stop-color="#FF8A2E"/>
      <stop offset="100%" stop-color="#F36B1C"/>
    </linearGradient>
  </defs>

  <!-- Orange-to-coral gradient backdrop -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#unappBg)"/>

  <!-- Stylised 3D cube — white, centred -->
  <g fill="#FFFFFF">
    <!-- Cube body — front + top + side projected -->
    <path d="M256 80 L420 168 L420 332 L256 424 L92 332 L92 168 Z"/>
    <!-- Top face shading (a hair darker so the form reads) -->
    <path d="M256 80 L420 168 L256 252 L92 168 Z" fill="#FFFFFF" opacity="1"/>
    <path d="M256 80 L420 168 L256 252 L92 168 Z" fill="#000000" opacity="0.06"/>
    <!-- Right face shading -->
    <path d="M420 168 L420 332 L256 424 L256 252 Z" fill="#000000" opacity="0.10"/>
    <!-- The notch — small doorway cut on the front-right -->
    <path d="M256 252 L320 220 L320 388 L256 420 Z" fill="url(#unappBg)"/>
  </g>
</svg>
