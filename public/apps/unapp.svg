<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unapp">
  <!-- Background — match Unapp brand black / soft navy -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0F0F12"/>

  <!-- Subtle gradient overlay for depth -->
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1F1B4A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F0F12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#g)"/>

  <!-- Wordmark — "Unapp" in cream, with a coral accent on the "U" -->
  <g font-family="Georgia, 'Recoleta', serif" font-weight="600" text-anchor="middle">
    <text x="256" y="296" font-size="148" fill="#F2ECCA">
      <tspan fill="#E34C39">U</tspan>napp
    </text>
  </g>

  <!-- Faint corner mark to feel intentional rather than generic -->
  <circle cx="64" cy="448" r="8" fill="#E34C39" opacity="0.45"/>
</svg>
