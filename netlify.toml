[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Forms picks up <form data-netlify="true"> automatically from the
# build output. No extra config needed here, but keep this file as the
# canonical Netlify deploy spec so the preview branch can be flipped over
# from Vercel without further setup.

[[headers]]
  for = "/legal/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/book/"
  to = "/book"
  status = 301
